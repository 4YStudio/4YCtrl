// 26.x 专用构建（Stonecutter 版本轴：26.1 / 26.2 / 26.3）。
//
// 26.x 起 Mojang 取消了混淆，官方名即运行时名，既没有 yarn 也没有 intermediary，
// 所以不能与根工程 src/（9 个 yarn 版本）共用 Stonecutter，而是单独一个 Gradle 工程。
//
// 共享源码（sdl/、config/、resources/）用**符号链接**接进本工程：
// Stonecutter 的 configureSource 会把指向工程外的 srcDir（相对路径以 ".." 开头）静默丢弃，
// 所以不能像以前那样写 srcDir '../src/main/java/...'；而 Gradle 的 Sync/Copy 会解引用符号链接，
// 于是链接进 mc26/src 后就能被 Stonecutter 正常生成到 versions/<ver>/build/generated。
plugins {
    // 注意：26.x 要带 net.fabricmc. 前缀的插件 id（根工程用的是短名 fabric-loom）。
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = "${property('mod_version')}+${stonecutter.current.version}"
group = property('maven_group')

base { archivesName = property('archives_base_name') }

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    // 注意：没有 mappings 行 —— 26.x 不需要（也找不到）。
    minecraft "com.mojang:minecraft:${property('dep.minecraft')}"
    implementation "net.fabricmc:fabric-loader:${property('dep.loader')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('dep.fapi')}"
    // ModMenu 只是可选集成：不打包、不强制用户装，运行时靠 entrypoint 探测。
    compileOnly "com.terraformersmc:modmenu:${property('dep.modmenu')}"
}

def javaVer = Integer.parseInt(property('dep.javalevel'))
def mcRange = property('meta.mc_range')
def javaReq = property('meta.java')
def compat = "JAVA_" + javaVer

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVer) }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVer
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_range", mcRange
    inputs.property "java_req", javaReq
    inputs.property "compat_level", compat

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_range": mcRange, "java_req": javaReq
    }
    filesMatching("fouryctrl.mixins.json") {
        expand "compat_level": compat
    }
}

jar {
    // 工程根是 mc26/，实际构建的是 mc26/versions/<ver>/，所以用 rootProject 定位仓库根的 LICENSE。
    from(rootProject.file("../LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
